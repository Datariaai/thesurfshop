<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#061a30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock TSS">
  <title>Stock · thesurfshop.ar</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
  <link rel="stylesheet" href="css/marca.css">
  <link rel="stylesheet" href="css/stock.css">
  <script type="module" src="js/stock.js"></script>
</head>
<body>

  <!-- Ingreso -->
  <section id="login" class="login mar" hidden>
    <div class="login-caja">
      <img src="img/logo.webp" alt="" class="login-logo" width="140" height="140">
      <h1 class="titulo-racing login-titulo">Stock</h1>
      <form id="form-login" autocomplete="on">
        <label class="campo">
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" inputmode="email" required>
        </label>
        <label class="campo">
          <span>Contraseña</span>
          <input type="password" name="clave" autocomplete="current-password" required>
        </label>
        <p class="login-error" id="login-error" role="alert"></p>
        <button class="btn btn-amarillo btn-grande" type="submit">Entrar</button>
      </form>
      <button id="btn-entrar-prueba" class="btn btn-amarillo btn-grande" type="button" hidden>Entrar (modo prueba)</button>
      <p class="login-nota" id="login-nota"></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="barra">
      <img src="img/wordmark.webp" alt="thesurfshop.ar" class="barra-marca" width="1400" height="225">
      <span class="barra-total" id="barra-total" aria-live="polite"></span>
      <button class="btn-icono" id="btn-salir" type="button" aria-label="Salir">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
      </button>
    </header>

    <p class="aviso-prueba" id="aviso-prueba" hidden>
      <strong>Modo prueba:</strong> los datos se guardan solo en este navegador. Falta conectar Firebase.
    </p>

    <main>
      <!-- Vista: stock -->
      <section id="vista-stock" class="vista">
        <div class="buscador">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="buscar" placeholder="Buscar modelo, marca o color" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="filtros" role="tablist" aria-label="Filtrar modelos">
          <button class="chip activo" data-filtro="todos" role="tab" aria-selected="true">Todos</button>
          <button class="chip" data-filtro="con" role="tab" aria-selected="false">Con stock</button>
          <button class="chip" data-filtro="bajo" role="tab" aria-selected="false">Poco stock</button>
          <button class="chip" data-filtro="sin" role="tab" aria-selected="false">Agotados</button>
        </div>
        <ul class="lista-modelos" id="lista-modelos"></ul>
        <div class="vacio" id="vacio-modelos" hidden>
          <p>Todavía no hay modelos cargados.</p>
          <button class="btn btn-amarillo" id="btn-iniciales" type="button">Cargar los 15 modelos de las fotos</button>
        </div>
      </section>

      <!-- Vista: movimientos -->
      <section id="vista-movs" class="vista" hidden>
        <div class="resumen-hoy" id="resumen-hoy"></div>
        <div class="filtro-modelo" id="filtro-modelo" hidden></div>
        <div id="lista-movs"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <button class="tab activo" data-vista="stock" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5zM4 7.5 12 11l8-3.5M12 11v9"/></svg>
        <span>Stock</span>
      </button>
      <button class="tab tab-nuevo" id="btn-nuevo" type="button">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>Modelo</span>
      </button>
      <button class="tab" data-vista="movs" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Movimientos</span>
      </button>
    </nav>
  </div>

  <!-- Hoja: un modelo con sus talles -->
  <dialog id="hoja-modelo" class="hoja" aria-labelledby="hm-nombre">
    <div class="hoja-asa" aria-hidden="true"></div>
    <header class="hm-cabecera">
      <img id="hm-foto" alt="" width="72" height="96">
      <div>
        <p class="hm-marca" id="hm-marca"></p>
        <h2 class="hm-nombre" id="hm-nombre"></h2>
        <p class="hm-total" id="hm-total"></p>
      </div>
      <button class="btn-icono" data-cerrar type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </header>
    <p class="hm-ayuda"><span class="pista-menos">−</span> vendí uno · <span class="pista-mas">+</span> entró uno · tocá el número para cargar varios</p>
    <div class="talles" id="hm-talles"></div>
    <div class="hm-acciones">
      <button class="btn btn-borde" id="hm-historial" type="button">Ver movimientos</button>
      <button class="btn btn-borde" id="hm-editar" type="button">Editar modelo</button>
    </div>
  </dialog>

  <!-- Hoja: cargar / descargar varios de un talle -->
  <dialog id="hoja-cant" class="hoja hoja-chica" aria-labelledby="hc-titulo">
    <div class="hoja-asa" aria-hidden="true"></div>
    <form id="form-cant" method="dialog">
      <h2 class="hc-titulo" id="hc-titulo"></h2>
      <div class="segmentado" role="radiogroup" aria-label="Qué querés hacer">
        <label><input type="radio" name="op" value="ingreso" checked><span>Entraron</span></label>
        <label><input type="radio" name="op" value="venta"><span>Vendí</span></label>
        <label><input type="radio" name="op" value="ajuste"><span>Hay en total</span></label>
      </div>
      <div class="hc-numero">
        <button type="button" class="btn-redondo" id="hc-menos" aria-label="Uno menos">−</button>
        <input type="number" id="hc-valor" inputmode="numeric" min="0" step="1" value="1" aria-label="Cantidad">
        <button type="button" class="btn-redondo" id="hc-mas" aria-label="Uno más">+</button>
      </div>
      <p class="hc-resultado" id="hc-resultado"></p>
      <button class="btn btn-amarillo btn-grande" type="submit" id="hc-ok">Guardar</button>
    </form>
  </dialog>

  <!-- Hoja: crear / editar modelo -->
  <dialog id="hoja-form" class="hoja" aria-labelledby="hf-titulo">
    <div class="hoja-asa" aria-hidden="true"></div>
    <form id="form-modelo" class="form-modelo">
      <header class="hf-cabecera">
        <h2 id="hf-titulo">Nuevo modelo</h2>
        <button class="btn-icono" data-cerrar type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </header>

      <label class="hf-foto">
        <img id="hf-foto-img" alt="" hidden>
        <span id="hf-foto-texto">+ Foto</span>
        <input type="file" id="hf-foto" accept="image/*" class="sr-only">
      </label>

      <label class="campo"><span>Nombre del modelo *</span><input name="nombre" required maxlength="60" placeholder="Ej: Pinstripe"></label>
      <div class="dos">
        <label class="campo"><span>Marca</span><input name="marca" list="marcas" maxlength="40" placeholder="Billabong"></label>
        <label class="campo"><span>Precio</span><input name="precio" type="number" inputmode="numeric" min="0" step="1" placeholder="$"></label>
      </div>
      <datalist id="marcas">
        <option value="Billabong"><option value="Quiksilver"><option value="Rip Curl"><option value="O'Neill"><option value="Volcom"><option value="Hurley"><option value="Oakley">
      </datalist>
      <label class="campo"><span>Color / descripción</span><input name="color" maxlength="60" placeholder="Azul marino rayado"></label>

      <fieldset class="campo">
        <legend>Talles</legend>
        <div class="talles-elegir" id="hf-talles"></div>
        <div class="talle-otro">
          <input id="hf-talle-otro" maxlength="6" placeholder="Otro talle" aria-label="Agregar otro talle">
          <button type="button" class="btn btn-borde" id="hf-talle-agregar">Agregar</button>
        </div>
      </fieldset>

      <p class="hf-error" id="hf-error" role="alert"></p>
      <button class="btn btn-amarillo btn-grande" type="submit">Guardar modelo</button>
      <button class="btn btn-peligro" type="button" id="hf-borrar" hidden>Borrar modelo</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual">
    <span id="toast-texto"></span>
    <button type="button" id="toast-deshacer">Deshacer</button>
  </div>

</body>
</html>
